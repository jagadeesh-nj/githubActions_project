name: multiple_parallal_jobs

on: [push, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: get code into the runner 
        uses: actions/checkout@v3
      - name: install dependencies
        run: npm ci
      - name: run lint
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code into the runner 
        uses: actions/checkout@v3
      - name: install dependencies
        run: npm ci
      - name: run tests
        run: npm run test
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: get code into the runner 
        uses: actions/checkout@v3
      - name: install dependencies
        run: npm ci
      - name: build the project
        run: npm run build     